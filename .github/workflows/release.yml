# Builds the Windows installer and attaches it (plus latest.yml and the
# blockmap, which the in-app auto-updater requires) to a DRAFT GitHub
# release named after the version in package.json.
#
# electron-builder's own GitHub publisher uploads artifacts in parallel and
# can race itself into creating duplicate draft releases, so packaging runs
# with --publish never and a single release step uploads everything at once.
#
# To ship a release, entirely from the browser:
#   1. Bump "version" in package.json on main (the web editor works fine)
#   2. Actions tab -> Release -> Run workflow
#   3. When it finishes, open Releases, review the draft, click Publish
name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package installer
        run: npx electron-builder --win --publish never

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Seed the release body with this version's What's New bullets (the same
      # notes shown in-app after auto-update); GitHub's auto-generated
      # PR/commit notes are appended below them by generate_release_notes.
      - name: Extract What's New notes for release body
        shell: bash
        run: node scripts/whatsnew-notes.js "${{ steps.version.outputs.version }}" > release-body.md

      - name: Create draft release with all artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: release-body.md
          generate_release_notes: true
          files: |
            release/MeetingScribe-Setup-*.exe
            release/MeetingScribe-Setup-*.exe.blockmap
            release/MeetingScribe-portable.exe
            release/latest.yml
