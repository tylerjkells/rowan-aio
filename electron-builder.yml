# appId (and the package name / data folder) deliberately stay meeting-scribe:
# the auto-updater and existing installs key off them. Only the display
# identity is Rowan AIO.
appId: com.tylerkells.meetingscribe
productName: Rowan AIO
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - build/icon.ico
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: RowanAIO-Setup-${version}.exe
publish:
  provider: github
  owner: tylerjkells
  repo: rowan-aio
portable:
  artifactName: RowanAIO-portable.exe
