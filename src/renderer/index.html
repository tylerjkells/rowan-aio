<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rowan AIO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- connect-src must list scribe-media: as well as media-src: the player
         fetches a recording into memory before playing it, and a fetch is
         governed by connect-src. Without it playback falls back to streaming
         the file, which cannot seek. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' scribe-media: blob:; img-src 'self' data: scribe-media:; connect-src 'self' scribe-media:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
